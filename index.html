<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Worksheet Wizard – AI Generator for Teachers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-xl p-8 w-full max-w-md">
    <h1 class="text-2xl font-bold text-blue-700 mb-2">Worksheet Wizard</h1>
    <p class="text-gray-600 text-sm mb-6">Create a classroom-ready worksheet in 30 seconds—no login needed.</p>
    
    <label class="block text-sm font-medium text-gray-700 mb-1">Topic</label>
    <input id="topic" type="text" placeholder="e.g., photosynthesis" 
           class="w-full border border-gray-300 rounded-lg p-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
    
    <label class="block text-sm font-medium text-gray-700 mb-1">Grade</label>
    <input id="grade" type="number" min="1" max="12" value="7" 
           class="w-full border border-gray-300 rounded-lg p-2 mb-4">
    
    <label class="block text-sm font-medium text-gray-700 mb-1"># of Questions</label>
    <input id="num" type="number" min="4" max="20" value="10" 
           class="w-full border border-gray-300 rounded-lg p-2 mb-4">
    
    <label class="block text-sm font-medium text-gray-700 mb-1">Style</label>
    <select id="style" class="w-full border border-gray-300 rounded-lg p-2 mb-6">
      <option>multiple choice</option>
      <option>short answer</option>
      <option>true/false</option>
    </select>
    
    <button onclick="generate()" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition">
      Generate PDF
    </button>
    
    <div id="msg" class="mt-4 text-sm text-center"></div>
  </div>

  <script src="worksheet.js"></script>
</body>
</html>
